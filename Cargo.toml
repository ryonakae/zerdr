[package]
name = "zerdr"
version = "0.5.0"
edition = "2024"
rust-version = "1.93.1"
description = "Keep Herdr sessions aligned with their Git checkouts in Zed"
license = "MIT"
repository = "https://github.com/ryonakae/zerdr"
homepage = "https://github.com/ryonakae/zerdr"
readme = "README.md"
keywords = ["zed", "terminal", "workspace", "herdr"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[package.metadata.dist]
dist = true

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
directories = "6.0.0"
fs2 = "0.4.3"
hex = "0.4.3"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde", "serde_json"] }
nix = { version = "0.31.3", features = ["signal", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = "0.4.4"
thiserror = "2.0.20"
toml = "1.1.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "libc"] }

[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serial_test = "4.0.1"
tempfile = "3.27.0"
