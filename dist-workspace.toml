[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
hosting = "github"
installers = ["homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
unix-archive = ".tar.xz"
tap = "ryonakae/homebrew-tap"
publish-jobs = ["homebrew"]
pr-run-mode = "plan"
allow-dirty = ["ci"]
